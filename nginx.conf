upstream api {
    server api:8000;
}

# ── HTTP: redirect to HTTPS ──────────────────────────────────
server {
    listen 80;
    server_name api.trustbutverify.dev;

    # Pre-wired for future Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name api.trustbutverify.dev;

    ssl_certificate     /etc/letsencrypt/live/api.trustbutverify.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.trustbutverify.dev/privkey.pem;

    # Modern TLS defaults
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # HSTS — enabled with Let's Encrypt (trusted cert)
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Max body size for sync payloads
    client_max_body_size 10M;

    location /api/ {
        proxy_pass         http://api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts for potentially large sync payloads
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # Block everything else
    location / {
        return 404;
    }
}
